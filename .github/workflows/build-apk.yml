name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Install Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Generate signing keystore (sekali saja)
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v \
              -keystore release.keystore \
              -storepass apkpengingat123 -keypass apkpengingat123 \
              -alias apk_pengingat -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Pengingat Kendaraan, OU=Personal, O=ApkPengingat, L=Jakarta, ST=DKI, C=ID"
          fi
          printf 'storeFile=release.keystore\nstorePassword=apkpengingat123\nkeyAlias=apk_pengingat\nkeyPassword=apkpengingat123\n' > keystore.properties

      - name: Build Debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleDebug

      - name: Build Release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Simpan keystore ke repo (pertama kali saja)
        run: |
          if git status --porcelain | grep -q 'release.keystore'; then
            git config user.email "actions@github.com"
            git config user.name "github-actions[bot]"
            git add release.keystore
            git commit -m "chore: simpan kunci tanda tangan permanen"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-pengingat
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/app-release.apk
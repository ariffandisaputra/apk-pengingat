name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Install Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Generate signing keystore (sekali saja)
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v \
              -keystore release.keystore \
              -storepass apkpengingat123 -keypass apkpengingat123 \
              -alias apk_pengingat -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Pengingat Kendaraan, OU=Personal, O=ApkPengingat, L=Jakarta, ST=DKI, C=ID"
          fi
          printf 'storeFile=release.keystore\nstorePassword=apkpengingat123\nkeyAlias=apk_pengingat\nkeyPassword=apkpengingat123\n' > keystore.properties

      - name: Build Debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleDebug

      - name: Build Release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Simpan keystore ke repo (pertama kali saja)
        run: |
          if git status --porcelain | grep -q 'release.keystore'; then
            git config user.email "actions@github.com"
            git config user.name "github-actions[bot]"
            git add release.keystore
            git commit -m "chore: simpan kunci tanda tangan permanen"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-pengingat
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/app-release.apk

  preview:
    needs: build
    runs-on: macos-13
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: apk-pengingat
          path: apk

      - name: Preview UI di emulator (screenshot otomatis)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 2048M
          disk-size: 8G
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -noaudio -no-boot-anim
          script: |
            set +e
            export PATH="$ANDROID_SDK_ROOT/platform-tools:$PATH"
            mkdir -p preview_/debug

            DEBUG_APK=$(find apk -name 'app-debug.apk' | head -1)
            echo "APK: $DEBUG_APK"

            adb install -r "$DEBUG_APK" || echo "install gagal"
            adb shell pm grant com.example.apk_pengingat android.permission.POST_NOTIFICATIONS 2>/dev/null
            adb shell cmd appops set com.example.apk_pengingat SCHEDULE_EXACT_ALARM allow 2>/dev/null
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell svc power stayon true

            dumpsnap() {
              for i in 1 2 3 4 5; do
                adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
                adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1
                if [ -s /tmp/ui.xml ]; then return 0; fi
                sleep 1
              done
            }

            tapxy() {
              local x=$1 y=$2
              while [ "$y" -gt 1750 ]; do
                adb shell input swipe 540 1500 540 700 200
                sleep 0.5
                y=$((y - 800))
              done
              while [ "$y" -lt 180 ]; do
                adb shell input swipe 540 600 540 1500 200
                sleep 0.5
                y=$((y + 900))
              done
              adb shell input tap "$x" "$y"
              sleep 1.2
            }

            tap_text_exact() {
              dumpsnap
              local res
              res=$(python3 - "$1" <<'PYEOF'
            import sys, re
            want = sys.argv[1]
            xml = open('/tmp/ui.xml', encoding='utf-8', errors='replace').read()
            for m in re.finditer(r'<node([^>]*)/?>', xml):
                attrs = dict(re.findall(r'([\w-]+)="([^"]*)"', m.group(1)))
                b = attrs.get('bounds','')
                n = list(map(int, re.findall(r'\d+', b)))
                if len(n) != 4: continue
                for key in ('text','content-desc'):
                    if attrs.get(key,'') == want:
                        print((n[0]+n[2])//2, (n[1]+n[3])//2)
                        sys.exit(0)
            print('NOTFOUND')
            PYEOF
            )
              if [ "$res" != "NOTFOUND" ] && [ -n "$res" ]; then
                tapxy $res
                return 0
              fi
              return 1
            }

            tap_text_contains() {
              dumpsnap
              local res
              res=$(python3 - "$1" <<'PYEOF'
            import sys, re
            want = sys.argv[1]
            xml = open('/tmp/ui.xml', encoding='utf-8', errors='replace').read()
            best = None
            best_area = 0
            for m in re.finditer(r'<node([^>]*)/?>', xml):
                attrs = dict(re.findall(r'([\w-]+)="([^"]*)"', m.group(1)))
                val = attrs.get('text') or attrs.get('content-desc') or ''
                if want.lower() in val.lower():
                    b = attrs.get('bounds','')
                    n = list(map(int, re.findall(r'\d+', b)))
                    if len(n) != 4: continue
                    area = (n[2]-n[0])*(n[3]-n[1])
                    if area > best_area:
                        best_area = area
                        best = ((n[0]+n[2])//2, (n[1]+n[3])//2)
            if best:
                print(best[0], best[1])
            else:
                print('NOTFOUND')
            PYEOF
            )
              if [ "$res" != "NOTFOUND" ] && [ -n "$res" ]; then
                tapxy $res
                return 0
              fi
              return 1
            }

            field_center() {
              dumpsnap
              python3 - "$1" <<'PYEOF'
            import sys, re
            idx = int(sys.argv[1])
            xml = open('/tmp/ui.xml', encoding='utf-8', errors='replace').read()
            nodes = []
            for m in re.finditer(r'<node([^>]*)/?>', xml):
                attrs = dict(re.findall(r'([\w-]+)="([^"]*)"', m.group(1)))
                if 'EditText' in attrs.get('class',''):
                    b = attrs.get('bounds','')
                    n = list(map(int, re.findall(r'\d+', b)))
                    if len(n) == 4:
                        nodes.append(((n[0]+n[2])//2, (n[1]+n[3])//2))
                        if idx == len(nodes)-1:
                            print(nodes[idx][0], nodes[idx][1])
                            sys.exit(0)
            print('NOTFOUND')
            PYEOF
            }

            type_text() {
              adb shell input text "$1"
              sleep 0.8
              adb shell input keyevent 4
              sleep 0.6
            }

            fill_field() {
              local c
              c=$(field_center "$1")
              if [ -z "$c" ] || [ "$c" = "NOTFOUND" ]; then
                echo "   (field $1 tak ditemukan)"
                return 1
              fi
              tapxy $c
              type_text "$2"
            }

            shot() {
              adb exec-out screencap -p > "preview_/s_$1.png" 2>/dev/null
              dumpsnap
              cp /tmp/ui.xml "preview_/debug/dump_$1.xml"
              echo "screenshot: s_$1.png"
            }

            adb shell am start -n com.example.apk_pengingat/.MainActivity
            sleep 5
            for i in 1 2 3; do
              if tap_text_exact "Allow"; then break; fi
              sleep 2
            done
            sleep 1
            shot "01_beranda_kosong"

            # === Tambah PAJAK ===
            tap_text_exact "Tambah pengingat" || true
            sleep 1
            shot "02_form_pajak_atas"
            fill_field 0 "Pajak%sTahunan%sMotor"
            fill_field 1 "B%s1234%sX"
            fill_field 2 "750000"
            tap_text_exact "Simpan" || true
            sleep 1.5
            shot "03_beranda_pajak"

            # === Tambah SIM ===
            tap_text_exact "Tambah pengingat" || true
            sleep 1
            tap_text_exact "SIM" || true
            sleep 1
            fill_field 0 "SIM%sC"
            fill_field 1 "SIM%sC"
            fill_field 2 "300000"
            tap_text_exact "Simpan" || true
            sleep 1.5

            # === Tambah SERVICE ===
            tap_text_exact "Tambah pengingat" || true
            sleep 1
            tap_text_exact "Service" || true
            sleep 1
            shot "04_form_service_atas"
            fill_field 0 "Service%sRutin"
            fill_field 1 "B%s9999%sY"
            fill_field 3 "45000"
            fill_field 4 "ganti%soli%sfilter%stune%sup"
            adb shell input swipe 540 1400 540 500 300
            sleep 1
            shot "05_form_service_bawah"
            tap_text_exact "Simpan" || true
            sleep 1.5
            shot "06_beranda_semua_jenis"

            # === Buka edit (cek isi form terisi kembali) ===
            tap_text_contains "Service Rutin" || true
            sleep 1.2
            shot "07_form_edit_service"
            adb shell input keyevent 4
            sleep 0.8

            echo "SELESAI"

      - name: Upload screenshot preview
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview-screenshots
          path: preview_